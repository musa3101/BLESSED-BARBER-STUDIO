      window.openLegalModal = (type) => {
        const modal = document.getElementById('mynext-legal-modal-root');
        const titleText = document.getElementById('mynext-legal-title-text');
        const bodyText = document.getElementById('mynext-legal-body-text');
        if (modal && titleText && bodyText && window.modalContents[type]) {
          const content = window.modalContents[type];
          titleText.innerText = content.title;
          bodyText.innerHTML = content.body;
          modal.classList.add('active');
          document.body.style.overflow = 'hidden';
        }
      };

      window.closeLegalModal = () => {
        const modal = document.getElementById('mynext-legal-modal-root');
        if (modal) {
          modal.classList.remove('active');
          document.body.style.overflow = '';
        }
      };

      function init() {
        // --- Utility ---
        const debounce = (func, wait) => {
          let timeout;
          return (...args) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => func(...args), wait);
          };
        };

        // --- Fix Mobile Menu Link Clicks ---
        document.addEventListener('click', (e) => {
          const anchor = e.target.closest('a[href^="#"]');
          if (anchor) {
            const isMobileMenu = anchor.closest('[role="dialog"]') || anchor.closest('[class*="fixed inset-0"]');
            if (isMobileMenu) {
              const targetId = anchor.getAttribute('href');
              const targetEl = document.querySelector(targetId);
              if (targetEl) {
                setTimeout(() => {
                  targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 200);
              }
            }
          }
        }, true);

        // --- 1. Animation Observer ---
        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.remove('reveal-pending');
              entry.target.classList.add('reveal-active');
            }
          });
        }, { threshold: 0.05, rootMargin: '0px 0px -30px 0px' });

        const observeElements = debounce(() => {
            const targets = document.querySelectorAll('.industrial-card:not(.reveal), .gallery-card:not(.reveal), #servicios .group:not(.reveal), #resenas .grid > div:not(.reveal), h2:not(.reveal)');
            targets.forEach(target => {
              target.classList.add('reveal', 'reveal-pending');
              revealObserver.observe(target);
            });
        }, 100);

        // --- Helper for Caching Videos ---
        const preloadVideo = async (url) => {
          try {
            const cache = await caches.open('blessed-video-cache');
            let response = await cache.match(url);
            if (!response) {
              await cache.add(url);
              response = await cache.match(url);
            }
            if (response) {
              const blob = await response.blob();
              return URL.createObjectURL(blob);
            }
          } catch (e) {
            console.warn("Cache API failed, falling back to direct URL", e);
          }
          return url;
        };

        // --- 2. Gallery Video Injection & Interaction ---
        const handleGallery = debounce(() => {
          const cards = document.querySelectorAll('.gallery-card');
          if (cards.length >= 6) {
            const middleIndices = [3, 4, 5];
            const videoSources = [
              './images/video1.mp4', 
              './images/video2.mp4', 
              './images/video3.mp4'
            ];

            let injectedCount = 0;
            middleIndices.forEach((index, i) => {
              const card = cards[index];
              const container = card.querySelector('.img-container');
              
              if (container && !container.querySelector('video')) {
                const img = container.querySelector('img');
                const video = document.createElement('video');
                
                if (img) {
                  video.poster = img.src;
                  img.style.display = 'none';
                }

                const rawSrc = videoSources[i];
                video.dataset.src = rawSrc;
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                video.preload = 'auto';
                video.setAttribute('muted', '');
                video.setAttribute('playsinline', '');
                
                video.className = 'w-full h-full object-cover transition-transform duration-700';
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.objectFit = 'cover';
                
                // Preload video as Blob to ensure instantaneous playing
                preloadVideo(rawSrc).then(blobUrl => {
                  video.src = blobUrl;
                  if (card.classList.contains('visible-on-screen')) {
                    video.play().catch(e => {});
                  }
                });

                const playVideo = () => {
                    video.play().catch(e => {});
                    video.style.transform = 'scale(1.03)';
                };

                const pauseVideo = () => {
                    video.style.transform = 'scale(1.0)';
                };

                card.addEventListener('mouseenter', playVideo);
                card.addEventListener('mouseleave', pauseVideo);
                
                card.addEventListener('click', (e) => {
                    if (video.paused) {
                        video.play().catch(e => {});
                    } else {
                        video.pause();
                    }
                });

                container.appendChild(video);
                card.classList.add('video-card', 'video-injected');
                injectedCount++;

                const lazyVideoObserver = new IntersectionObserver((entries) => {
                  entries.forEach(entry => {
                    if (entry.isIntersecting) {
                      card.classList.add('visible-on-screen');
                      if (video.src) video.play().catch(e => {});
                    } else {
                      card.classList.remove('visible-on-screen');
                      video.pause();
                    }
                  });
                }, { threshold: 0.15 });
                lazyVideoObserver.observe(card);
              }
            });

            if (injectedCount > 0) window.dispatchEvent(new Event('resize'));

            if (cards.length >= 8) {
              const card8 = cards[7];
              const img8 = card8.querySelector('img');
              if (img8 && !img8.src.includes('fotonuew.png')) {
                img8.src = './images/fotonuew.png';
              }
            }
          }
        }, 150);

        // --- 3. Production Fixes & CSS Polish ---
        const optimizeProduction = debounce(() => {
          document.querySelectorAll('button, a, p, span, div').forEach(el => {
              if (el.children.length === 0) {
                  const text = el.textContent.trim();
                  if (text.includes('WHATSAPP CON GUSTAVO')) el.textContent = 'RESERVAR CON WHATSAPP';
                  if (text.includes('WhatsApp con servicio')) el.textContent = 'RESERVAR CON WHATSAPP';
                  if (text.includes('631 935 439')) el.textContent = 'PALMA DE MALLORCA';
                  
                  if (text === 'By Gustavo' || text === 'Est. 2024 · Palma' || text === 'PREMIUM CUTS.') {
                      el.style.display = 'none';
                      el.style.visibility = 'hidden';
                      const parent = el.closest('div, a, button');
                      if (parent && parent.tagName !== 'NAV' && parent.children.length <= 2) {
                          parent.style.display = 'none';
                      }
                  }
              }
          });

          document.querySelectorAll('img:not(.lazy-applied)').forEach(img => {
            if (!img.getAttribute('loading')) img.setAttribute('loading', 'lazy');
            if (!img.alt) img.alt = "Blessed Barber Studio — Barbería Premium";
            img.classList.add('transition-opacity', 'duration-500', 'lazy-applied');
          });

          const mapContainer = document.querySelector('#mapa > div:last-child');
          if (mapContainer && !mapContainer.classList.contains('map-observed')) {
            mapContainer.classList.add('map-observed');
            mapContainer.addEventListener('click', () => mapContainer.classList.add('map-active'));
            const mapObserver = new IntersectionObserver((entries) => {
              if (!entries[0].isIntersecting) mapContainer.classList.remove('map-active');
            }, { threshold: 0 });
            mapObserver.observe(mapContainer);
          }

          const footer = document.querySelector('footer');
          const gridContainer = footer ? footer.querySelector('.container') : null;
          const copyrightP = Array.from(document.querySelectorAll('p')).find(p => p.textContent.includes('Blessed Barber Studio. Todos los derechos reservados.'));
          
          if (footer && gridContainer && copyrightP) {
            let bottomContainer = document.getElementById('footer-bottom-row');
            if (!bottomContainer) {
              bottomContainer = document.createElement('div');
              bottomContainer.id = 'footer-bottom-row';
              bottomContainer.className = 'w-full mt-10 pt-8 border-t border-white/5 flex flex-col items-center gap-2 text-center col-span-full md:col-span-3';
              gridContainer.appendChild(bottomContainer);
            }
            
            if (copyrightP.parentNode !== bottomContainer) {
              bottomContainer.appendChild(copyrightP);
            }
            
            let creditP = document.getElementById('mynext-credit');
            if (!creditP) {
              creditP = document.createElement('p');
              creditP.id = 'mynext-credit';
              creditP.className = 'mynext-credit';
              creditP.innerHTML = 'Made by <a href="https://mynextbymusa.pages.dev/" target="_blank" rel="noopener noreferrer" class="mynext-link">MYNEXT</a>';
              const oldCredit = document.getElementById('musa-credit');
              if (oldCredit) oldCredit.remove();
            }
            
            if (creditP.parentNode !== bottomContainer) {
              bottomContainer.appendChild(creditP);
            }
          }

          document.querySelectorAll('a:not(.esencia-applied), button:not(.esencia-applied), h2:not(.esencia-applied), h3:not(.esencia-applied), span:not(.esencia-applied)').forEach(el => {
            if (el.textContent.trim().toUpperCase() === 'FILOSOFÍA' || el.textContent.trim() === 'Filosofía') {
              el.textContent = 'Nuestra Esencia';
              el.classList.add('font-serif', 'esencia-applied');
            }
          });
        }, 150);

        // Combined Observer for Performance
        const runAll = () => {
          observeElements();
          handleGallery();
          optimizeProduction();
        };

        runAll();
        const globalObserver = new MutationObserver(runAll);
        globalObserver.observe(document.body, { childList: true, subtree: true });
      }

      // Safe Init Runner
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
